<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Pier Boardwalk Deck -->
  <rect x="0" y="380" width="1200" height="40" fill="#8C5638"/>
  <rect x="0" y="420" width="1200" height="80" fill="#5C3823"/>
  <!-- Wooden Pilings -->
  <g stroke="#3D2416" stroke-width="8">
    <line x1="100" y1="420" x2="100" y2="500"/>
    <line x1="300" y1="420" x2="300" y2="500"/>
    <line x1="500" y1="420" x2="500" y2="500"/>
    <line x1="700" y1="420" x2="700" y2="500"/>
    <line x1="900" y1="420" x2="900" y2="500"/>
    <line x1="1100" y1="420" x2="1100" y2="500"/>
  </g>
  <!-- Santa Monica Ferris Wheel Structure -->
  <g transform="translate(950, 220)">
    <circle cx="100" cy="100" r="90" stroke="#EC4899" stroke-width="8" fill="none"/>
    <circle cx="100" cy="100" r="15" fill="#FBBF24"/>
    <!-- Spokes -->
    <line x1="100" y1="10" x2="100" y2="190" stroke="#38BDF8" stroke-width="4"/>
    <line x1="10" y1="100" x2="190" y2="100" stroke="#38BDF8" stroke-width="4"/>
    <line x1="36" y1="36" x2="164" y2="164" stroke="#38BDF8" stroke-width="4"/>
    <line x1="36" y1="164" x2="164" y2="36" stroke="#38BDF8" stroke-width="4"/>
  </g>
</svg>
