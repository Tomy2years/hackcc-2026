<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Irvine Spectrum Giant Wheel Silhouette -->
  <g transform="translate(100, 140)" opacity="0.9">
    <circle cx="120" cy="120" r="110" stroke="#F59E0B" stroke-width="10" stroke-dasharray="10 15" fill="none"/>
    <circle cx="120" cy="120" r="20" fill="#EF4444"/>
    <line x1="120" y1="240" x2="60" y2="340" stroke="#B45309" stroke-width="10"/>
    <line x1="120" y1="240" x2="180" y2="340" stroke="#B45309" stroke-width="10"/>
  </g>
  <!-- Boba Cup Cartoon Vector -->
  <g transform="translate(960, 200)">
    <path d="M 30 50 L 50 240 Q 90 260 130 240 L 150 50 Z" fill="#FDE68A" stroke="#D97706" stroke-width="6"/>
    <!-- Lid and straw -->
    <rect x="20" y="35" width="140" height="20" rx="10" fill="#F43F5E"/>
    <rect x="80" y="-20" width="16" height="70" rx="4" fill="#3B82F6" transform="rotate(-12 80 -20)"/>
    <!-- Boba pearls -->
    <circle cx="70" cy="210" r="12" fill="#1F2937"/>
    <circle cx="105" cy="220" r="12" fill="#1F2937"/>
    <circle cx="85" cy="190" r="12" fill="#1F2937"/>
    <circle cx="120" cy="195" r="12" fill="#1F2937"/>
